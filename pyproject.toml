[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "things-agent-workflow"
version = "0.1.0"
description = "Human-side handoff tools for Things 3 and parallel coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.0.3,<5",
  "things-py>=1.0.1,<2",
]

[project.scripts]
things-agent-workflow = "things_agent_workflow.server:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/things_agent_workflow"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["things_agent_workflow"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
